[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gravity-well-gateway"
version = "1.0.0"
description = "Self-hosted FastAPI/Uvicorn ACP gateway for Google Antigravity (agy)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "websockets>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gravity_well_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.uv]
managed = false
